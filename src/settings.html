<!DOCTYPE html>
<html lang="en" data-theme="dark" data-dp-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="settingsTitle">Glimpser Settings</title>
  <link rel="stylesheet" href="css/foundation.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <span class="logo-img" aria-hidden="true"></span>
        <h1 data-i18n="settingsTitle">Glimpser Settings</h1>
        <span class="version" id="versionBadge"></span>
      </div>
    </header>

    <nav id="tabs" role="tablist"></nav>

    <main id="tab-content"></main>

    <footer class="footer">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="footer-name">Glimpser</span>
          <span class="footer-version" id="footerVersion"></span>
        </div>
        <div class="footer-links">
          <a class="footer-link" href="https://github.com/ffainy/glimpser" target="_blank" rel="noopener">
            <span class="footer-link-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span data-i18n="footerGithub">GitHub</span>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <span class="footer-privacy">
          <span class="footer-privacy-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
          <span data-i18n="footerPrivacy">No data collection</span>
        </span>
        <span class="footer-author">
          <span class="footer-heart-icon">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span data-i18n="footerAuthor">Made with love by farfaraway</span>
        </span>
      </div>
    </footer>
  </div>

  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <div class="save-state" role="status" aria-live="polite">
        <span class="save-state-dot" aria-hidden="true"></span>
        <span id="saveStateText" data-i18n="stateSaved">All changes saved</span>
      </div>
      <div class="action-bar-actions">
        <button type="button" class="btn btn-secondary" id="btnReset" data-i18n="btnReset">Reset</button>
        <button type="button" class="btn btn-primary" id="btnSave" data-i18n="btnSave">Save</button>
      </div>
    </div>
  </div>

  <div id="status-bar"></div>
  <script src="i18n.js"></script>
  <script src="settings.js"></script>
</body>
</html>
