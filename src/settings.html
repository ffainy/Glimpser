<!DOCTYPE html>
<html lang="en" data-theme="dark" data-dp-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="settingsTitle">Glimpser Settings</title>
  <link rel="stylesheet" href="css/foundation.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <span class="logo-img" data-icon="brandMark" aria-hidden="true"></span>
        <h1><span class="brand-accent">Glimpser</span> <span data-i18n="settingsTitleSuffix">Settings</span></h1>
        <span class="version" id="versionBadge"></span>
      </div>
    </header>

    <nav id="tabs" role="tablist"></nav>

    <main id="tab-content"></main>

    <footer class="footer">
      <div class="footer-top">
        <div class="footer-brand">
          <a class="footer-name" href="https://github.com/ffainy/glimpser" target="_blank" rel="noopener noreferrer">Glimpser</a>
        </div>
        <div class="footer-links">
          <a class="footer-link" href="https://github.com/ffainy/glimpser" target="_blank" rel="noopener noreferrer">
            <span class="footer-link-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span data-i18n="footerGithub">GitHub</span>
          </a>
        </div>
      </div>
      <div class="footer-bottom">
        <span class="footer-privacy">
          <span class="footer-privacy-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 8.82a15 15 0 0120 0"/>
              <path d="M20 16v-2a2 2 0 00-4 0v2"/>
              <path d="M5 12.859a10 10 0 018.436-2.756"/>
              <path d="M8.5 16.429a5 5 0 011.794-1.13"/>
              <rect x="14" y="16" width="8" height="5" rx="1"/>
            </svg>
          </span>
          <span data-i18n="footerPrivacy">Runs locally · No data collection</span>
        </span>
        <span class="footer-author">
          <span class="footer-heart-icon">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>
            </svg>
          </span>
          <span id="footerAuthorText"></span>
        </span>
      </div>
    </footer>
  </div>

  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <div class="save-state" role="status" aria-live="polite">
        <span class="save-state-dot" aria-hidden="true"></span>
        <span id="saveStateText" data-i18n="stateSaved">All changes saved</span>
      </div>
      <div class="action-bar-actions">
        <button type="button" class="btn btn-secondary" id="btnReset" data-i18n="btnReset">Reset</button>
        <button type="button" class="btn btn-primary" id="btnSave" data-i18n="btnSave">Save</button>
      </div>
    </div>
  </div>

  <div id="status-bar"></div>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="settings.js"></script>
</body>
</html>
