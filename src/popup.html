<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glimpser</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
  <div id="app">
    <div class="header">
      <img class="logo" src="icons/logo.svg" alt="Glimpser" width="18" height="18" />
      <span class="brand">Glimpser</span>
      <span class="version" id="versionBadge"></span>
      <div class="header-actions">
        <button class="header-btn" id="openSettings" title="Settings" aria-label="Settings" data-i18n-title="ariaOpenSettings" data-i18n-aria-label="ariaOpenSettings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      </div>
    </div>

    <div class="section">
      <div class="section-label" data-i18n="tabPreview">Preview</div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelPreviewEnabled">Enable preview</span>
        </span>
        <label class="toggle">
          <input type="checkbox" id="previewEnabled" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelPreviewTrigger">Trigger mode</span>
          <span class="row-hint" id="triggerHint"></span>
        </span>
        <label class="toggle">
          <input type="checkbox" id="previewTriggerMode" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelMultiplePreviewWindows">Multiple preview windows</span>
          <span class="row-hint" data-i18n="hintMultipleWindowsPopup">Up to 10 windows</span>
        </span>
        <label class="toggle">
          <input type="checkbox" id="multipleWindows" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-label" data-i18n="sectionThisSite">This site</div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelBlockCurrentSite">Block current site</span>
          <span class="row-hint" id="siteHint"></span>
        </span>
        <label class="toggle">
          <input type="checkbox" id="blockCurrentSite" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="section">
      <div class="section-label" data-i18n="labelPreferences">Interface</div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelLang">Language</span>
        </span>
        <select id="language">
          <option value="en" data-i18n="langEn">English</option>
          <option value="zh_CN" data-i18n="langZh">中文</option>
        </select>
      </div>

      <div class="status-row">
        <span class="status-label">
          <span class="label-main" data-i18n="labelTheme">Theme</span>
        </span>
        <select id="theme">
          <option value="system" data-i18n="themeSystem">System</option>
          <option value="light" data-i18n="themeLight">Light</option>
          <option value="dark" data-i18n="themeDark">Dark</option>
        </select>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
