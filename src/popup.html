<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glimpser</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
  <div id="app">
    <div class="header">
      <img class="logo" src="icons/logo.svg" alt="Glimpser" width="18" height="18" />
      <span class="brand">Glimpser</span>
      <span class="version" id="versionBadge"></span>
      <div class="header-actions">
        <button class="header-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme" data-i18n-title="ariaToggleTheme" data-i18n-aria-label="ariaToggleTheme">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 512 512">
            <path fill="currentColor" d="M256 104c-83.813 0-152 68.187-152 152s68.187 152 152 152s152-68.187 152-152s-68.187-152-152-152m0 272a120 120 0 1 1 120-120a120.136 120.136 0 0 1-120 120M240 16h32v48h-32zm0 432h32v48h-32zm208-208h48v32h-48zm-432 0h48v32H16zm372.687 171.314l22.627-22.627l32 32l-22.627 22.627zm-320-320l22.628-22.628l32 32l-22.628 22.628zm-.002 329.375l32-32l22.628 22.626l-32 32zm320.002-320.003l32-32l22.628 22.628l-32 32z"/>
          </svg>
        </button>
        <button class="header-btn" id="openSettings" title="Settings" aria-label="Settings" data-i18n-title="ariaOpenSettings" data-i18n-aria-label="ariaOpenSettings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
      </div>
    </div>

    <div class="status-row">
      <span class="status-label" data-i18n="labelPreviewEnabled">Enable preview</span>
      <label class="toggle">
        <input type="checkbox" id="previewEnabled" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="status-row">
      <span class="status-label" data-i18n="labelPreviewTrigger">Trigger mode</span>
      <select id="previewTriggerMode" class="input-xs">
        <option value="release" data-i18n="triggerRelease">Release anywhere</option>
        <option value="drop-area" data-i18n="triggerDropArea">Drop area</option>
      </select>
    </div>

  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
