<!DOCTYPE html>
<html lang="en" data-theme="dark" data-dp-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glimpser</title>
  <link rel="stylesheet" href="css/foundation.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>
  <main id="app">
    <div class="header">
      <span class="logo" aria-hidden="true"></span>
      <span class="brand brand-accent">Glimpser</span>
      <span class="version" id="versionBadge"></span>
      <div class="header-actions">
        <div class="theme-switch" role="radiogroup" data-i18n-aria-label="labelTheme">
          <button class="theme-btn" type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-value="system" data-icon="system" data-i18n-title="themeSystem" data-i18n-aria-label="themeSystem"></button>
          <button class="theme-btn" type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-value="light" data-icon="light" data-i18n-title="themeLight" data-i18n-aria-label="themeLight"></button>
          <button class="theme-btn" type="button" role="radio" aria-checked="false" tabindex="-1" data-theme-value="dark" data-icon="dark" data-i18n-title="themeDark" data-i18n-aria-label="themeDark"></button>
        </div>
        <button class="icon-btn" id="openSettings" type="button" data-icon="settings" data-i18n-title="ariaOpenSettings" data-i18n-aria-label="ariaOpenSettings"></button>
      </div>
    </div>

    <div class="popup-body">
      <section class="section-body">
        <div class="section-title">
          <span class="section-icon" data-icon="preview" aria-hidden="true"></span>
          <span data-i18n="tabPreview">Preview</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">
            <span class="label-main" data-i18n="labelPreviewEnabled">Enable preview</span>
          </span>
          <span class="setting-control">
            <label class="toggle">
              <input type="checkbox" id="previewEnabled" data-i18n-aria-label="labelPreviewEnabled" />
              <span class="slider"></span>
            </label>
          </span>
        </div>

        <div class="setting-row">
          <span class="setting-label">
            <span class="label-main" data-i18n="labelPreviewTrigger">Trigger mode</span>
            <span class="label-hint" id="triggerHint"></span>
          </span>
          <span class="setting-control">
            <label class="toggle">
              <input type="checkbox" id="previewTriggerMode" data-i18n-aria-label="labelPreviewTrigger" />
              <span class="slider"></span>
            </label>
          </span>
        </div>

        <div class="setting-row">
          <span class="setting-label">
            <span class="label-main" data-i18n="labelMultiplePreviewWindows">Multiple preview windows</span>
            <span class="label-hint" data-i18n="hintMultipleWindowsPopup">Up to 10 windows</span>
          </span>
          <span class="setting-control">
            <label class="toggle">
              <input type="checkbox" id="multipleWindows" data-i18n-aria-label="labelMultiplePreviewWindows" />
              <span class="slider"></span>
            </label>
          </span>
        </div>
      </section>

      <section class="section-body">
        <div class="section-title">
          <span class="section-icon" data-icon="homepage" aria-hidden="true"></span>
          <span data-i18n="sectionThisSite">This site</span>
        </div>

        <div class="setting-row">
          <span class="setting-label">
            <span class="label-main" data-i18n="labelBlockCurrentSite">Block current site</span>
            <span class="label-hint" id="siteHint"></span>
          </span>
          <span class="setting-control">
            <label class="toggle">
              <input type="checkbox" id="blockCurrentSite" data-i18n-aria-label="labelBlockCurrentSite" />
              <span class="slider"></span>
            </label>
          </span>
        </div>
      </section>

      <section class="section-body">
        <div class="section-title">
          <span class="section-icon" data-icon="languageTheme" aria-hidden="true"></span>
          <span data-i18n="labelPreferences">Interface</span>
        </div>

        <div class="setting-row has-segmented">
          <span class="setting-label">
            <span class="label-main" data-i18n="labelLang">Language</span>
          </span>
          <span class="setting-control">
            <span class="segmented-control" role="radiogroup" data-i18n-aria-label="labelLang">
              <label class="segmented-option">
                <input type="radio" name="language" value="en" />
                <span data-i18n="langEn">English</span>
              </label>
              <label class="segmented-option">
                <input type="radio" name="language" value="zh_CN" />
                <span data-i18n="langZh">中文</span>
              </label>
            </span>
          </span>
        </div>
      </section>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
